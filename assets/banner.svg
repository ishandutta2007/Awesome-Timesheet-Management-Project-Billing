<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Animated Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.6; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes scanLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseRing {
      0% { r: 18px; opacity: 0.8; }
      100% { r: 32px; opacity: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 250px; }
    .floating-card-1 { animation: floatCard1 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard2 6s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8, 8; animation: scanLine 20s linear infinite; }
    .radar-ring { animation: pulseRing 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    .mono-text {
      font-family: 'SF Mono', Consolas, Monaco, monospace;
      font-size: 12px;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="90" r="140" fill="#0284c7" filter="url(#glow-cyan)" />
  <circle class="orb-2" cx="980" cy="270" r="160" fill="#0d9488" filter="url(#glow-cyan)" />

  <!-- Flowing Pipeline Curves (Dynamic background flows) -->
  <path class="flow-line" d="M 50,300 Q 300,340 500,260 T 950,180 T 1180,80" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
  <path class="flow-line" d="M 20,240 Q 250,160 550,220 T 1000,100 T 1180,200" fill="none" stroke="#10b981" stroke-width="2" opacity="0.2" />

  <!-- Dynamic Side Graphic 1: Live Billable Hours Tracker Pill / Card -->
  <g class="floating-card-1" transform="translate(860, 48)">
    <rect width="280" height="92" rx="14" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" filter="url(#card-shadow)" />
    <!-- Clock / Pulse Indicator -->
    <circle cx="36" cy="46" r="14" fill="#0369a1" />
    <circle class="radar-ring" cx="36" cy="46" r="14" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="36" cy="46" r="5" fill="#38bdf8" />
    <text x="64" y="38" fill="#94a3b8" class="mono-text" letter-spacing="1">TIME TRACKED • LIVE</text>
    <text x="64" y="62" fill="#f8fafc" class="title-text" font-size="20">07h 42m <tspan fill="#10b981" font-size="14">(Billable)</tspan></text>
    <rect x="64" y="72" width="180" height="4" rx="2" fill="#334155" />
    <rect x="64" y="72" width="138" height="4" rx="2" fill="#38bdf8" />
  </g>

  <!-- Dynamic Side Graphic 2: Automated Project Invoice Pill / Card -->
  <g class="floating-card-2" transform="translate(880, 168)">
    <rect width="270" height="90" rx="14" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" filter="url(#card-shadow)" />
    <!-- Status Icon -->
    <rect x="22" y="26" width="36" height="36" rx="8" fill="#064e3b" />
    <path d="M 33 44 L 38 49 L 48 37" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="70" y="42" fill="#94a3b8" class="mono-text" letter-spacing="1">INVOICE GENERATED</text>
    <text x="70" y="65" fill="#f8fafc" class="title-text" font-size="20">$4,850.00 <tspan fill="#34d399" font-size="13">PAID</tspan></text>
  </g>

  <!-- Dynamic Bottom Feature Pills -->
  <g transform="translate(70, 280)">
    <!-- Pill 1: Timesheets -->
    <rect x="0" y="0" width="156" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="22" fill="#e2e8f0" class="badge-text">Timesheet Audit</text>

    <!-- Pill 2: Project Billing -->
    <rect x="168" y="0" width="168" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="186" cy="17" r="4" fill="#10b981" />
    <text x="200" y="22" fill="#e2e8f0" class="badge-text">Project Billing PSA</text>

    <!-- Pill 3: Invoicing -->
    <rect x="348" y="0" width="158" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="366" cy="17" r="4" fill="#818cf8" />
    <text x="380" y="22" fill="#e2e8f0" class="badge-text">Smart Invoicing</text>

    <!-- Pill 4: Open Source -->
    <rect x="518" y="0" width="180" height="34" rx="17" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="536" cy="17" r="4" fill="#f59e0b" />
    <text x="550" y="22" fill="#e2e8f0" class="badge-text">SaaS &amp; Open Source</text>
  </g>

  <!-- Top Category Tag -->
  <g transform="translate(72, 60)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
    <text x="14" y="19" fill="#38bdf8" class="badge-text" font-size="12" letter-spacing="1">CURATED AWESOME STACK</text>
  </g>

  <!-- Main Hero Titles in Foreground (Never blocked, high contrast) -->
  <!-- Subtle Drop shadow to guarantee contrast -->
  <text x="70" y="142" fill="#000000" opacity="0.6" class="title-text" font-size="44">Awesome Timesheet Management</text>
  <text x="70" y="140" fill="#ffffff" class="title-text" font-size="44">
    Awesome Timesheet Management
  </text>
  
  <text x="70" y="192" fill="#000000" opacity="0.6" class="title-text" font-size="34">&amp; Project Billing Solutions</text>
  <text x="70" y="190" fill="url(#accent-cyan)" class="title-text" font-size="34">
    &amp; Project Billing Solutions
  </text>

  <!-- Subtitle -->
  <text x="72" y="235" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400">
    The ultimate curated index of enterprise PSA platforms, SaaS billing engines, and self-hosted open-source tools.
  </text>
</svg>